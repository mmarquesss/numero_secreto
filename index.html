<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número Secreto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Jogo do Número Secreto</h1>
        <p>Adivinhe o número entre 1 e 10:</p>
        
        <input type="number" id="chute" min="1" max="10" placeholder="Digite um número">
        <button onclick="verificarChute()">Tentar</button>
        
        <p id="resultado"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
